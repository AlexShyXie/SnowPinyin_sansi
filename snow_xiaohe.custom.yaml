# 冰雪小鹤（snow_xiaohe）用户自定义补丁
# 说明：本方案由冰雪三拼换用声笔小鹤键位而来
#   声母：zh/ch/sh 并入 z/c/s，零声母用 v
#   韵母：小鹤韵码（占满 26 键）
#   声调：第 3 码，a/e/i/o/u 表示 1/2/3/4/5 声
#   顶功：两码（声韵）后接声码不顶，所以「马上」打 mash 不会被顶开
patch:
  # ── 万象快符处理器 ────────────────────────────────────
  # 必须插在 popping（本方案 processors 的 0-based 下标 4）之前：
  # popping 的「标点大写顶」会把 / 当标点顶屏并直接上屏，快符就永远触发不到
  engine/processors/@before 4: lua_processor@*sbxlm.wx_quick_symbol

  # ── 快符配置 ─────────────────────────────────────────
  # 字母 + / 快速上屏；q 键默认重复上一次上屏内容
  # trigger 的捕获组 ([a-z]) 即快符字母键，可自定义触发格式
  # 单字母是声母简码态，此拦截优先于顶屏，直接上屏快符映射并清码
  quick_symbol_text:
    trigger: "^([a-z])/$"
    symkey:
      q: "：“"        # 原 $ddcmd(：“,：“) 取第一个参数
      w: "？"
      e: "（"
      r: "）"
      t: "\t"         # 原 \t，YAML 双引号里用 \t 转义
      y: "《"
      u: "》"
      a: "！"
      s: "……"
      d: "、"
      f: "repeat"     # 原 <last.1>，重复上一次上屏
      g: "·"
      h: "《》"
      j: '""'         # 半角双引号对，用单引号包最省事
      k: "()"
      l: "（）"
      z: "“"
      c: "”"
      v: "——"
      b: "　"         # 全角空格 U+3000
      m: "@"
      x: "_"
      o: "「」"
      p: "『』"
      # i: 撤销      —— Rime 无法发键，删掉或改挂别的符号
      # n: End       —— 同上

  # ── 调序与固定合并（一个库、一套标记）────────────────
  # 原先同时装着万象排序（wx_sequence：↕ 标记、独立库 snow_xiaohe_sequence）与冰雪固定
  # （Ctrl+; / Ctrl+[ ] / Ctrl+\，📌📍 标记、写 snow.user_dict），两者功能重复。
  # 现在只留冰雪固定：关闭自动调频后词序不再自变，位置全部由这几个键手动指定。
  # snow.user_dict 处理器排在 key_binder 之前（snow_xiaohe.schema.yaml:35 vs :36），
  # 能抢在 `Control+p → Up (composing)`（default.yaml:22）、`Control+[ → Escape`（:32）
  # 之前吞掉这些键，所以不用额外卸载 key_binder 的绑定。
  # 这三个键位是 user_dict 的可选能力（未配置即关闭），四拼 snow_sipin 因此不受影响。
  translator/pin_key: "Control+p"        # 置顶到第 1 位；已经置顶再按一次 = 取消
  translator/alt_reset_key: "Control+l"  # 重置该编码，与 Ctrl+\ 等价
  translator/move_unfixed: true          # Ctrl+[ ] 对未固定的候选也直接生效，不必先 Ctrl+;
  # 默认保留的键位：Ctrl+; 固定/取消固定到当前位、Ctrl+[ ] 上移/下移、
  # Ctrl+\ 重置该编码、Ctrl+' 自由加词（见 lua/snow/user_dict.lua:37-41）

  # ── 关闭自动调频（盲打确定性）─────────────────────────
  # table_like 用 Component.Translator 实例化了 translator、jianpin 两个 script_translator
  # （lua/snow/table_like.lua:19 与 :112），默认开启 librime 用户词典 = 自动调频 + 自动成词，
  # 这就是「意志 viziaa 打几次就跳到 5 码、4 码首选」的根源：词序随使用漂移，盲打无法成形。
  # 关掉后，一个词在哪个码长出现、排第几位，只由词库权重 + 固顶表 + 手动排序决定，一次适应后不变。
  # 注意 translator/enable_schema_user_dict（冰雪自有的固顶/调序/造词库）与此无关，必须保持 true：
  # Ctrl+; 固顶、Ctrl+p 置顶、Ctrl+[/] 移动、Ctrl+l 或 Ctrl+\ 重置、Ctrl+' 造词、自动造词，
  # 全都写这一个库，位置由 snow.fix 呈现，不受本项影响。
  # 代价：拆字造词、缓冲造词（Ctrl+j）依赖 librime 记忆，关闭后失效；已由 lua/snow/auto_phrase.lua
  # 补回——把选字/缓冲造的词写进冰雪自有库（与 Ctrl+' 同款），见文末 auto_phrase 段。
  translator/enable_user_dict: false
  jianpin/enable_user_dict: false

  # 开启补全：二字词打到第三码（如 mas 的 s）时也能出词组候选
  # 棱镜会把不完整的末音节展开成所有以它开头的音节（ma s → 马上、马术…）
  # 若觉得候选变吵，改成 false 即可回到原行为
  translator/enable_completion: true

  # 三码（声码 + 韵码 + 次字声码，如 mas）不记入 postpone 的「已出现首选」，
  # 这样同一个二字词打满四码（如 mash）时不会被后置到第 2 位。
  # 二码（单字在长码让位）、四码及以上的让位行为保留；postpone 功能本身不关闭。
  # 删除本行即回退到原行为。
  translator/disable_postpone_pattern: "^[bpmfdtnlgkhjqxzcsrywv][a-z][bpmfdtnlgkhjqxzcsrywv]$"

  key_binder/bindings/+:
    - { when: has_menu, accept: semicolon, send: 2 }
    # - { when: has_menu, accept: apostrophe, send: 3 }
    # - { when: has_menu, accept: slash, send: 8 }
    - { accept: minus, send: Page_Up, when: has_menu }
    - { accept: equal, send: Page_Down, when: has_menu }
  menu/page_size: 3

  engine/translators/+:
    - table_translator@custom_phrase
  custom_phrase:
    dictionary: ""
    user_dict: custom_phrase
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 99

  # ── 自动造词（选字造词 + 缓冲造词）─────────────────────
  # 关闭 librime 用户词典后，「打几次就跳到短码首选」没有了，选字造词与 Ctrl+j 缓冲造词也一并失效。
  # 这个过滤器在 commit 时把「一次输入内选了多个候选」拼成的词写进冰雪自有用户词典，
  # 由 snow.fix 置顶呈现（带 📍），与 Ctrl+' 造词完全同款，位置可用 Ctrl+; / Ctrl+p / Ctrl+u,i 自调。
  # 只记「你造词时打到的那个码」：4 码拆字记 4 码、5 码拆字记 5 码、缓冲打全码记 6 码（按调₂调₁重排）。
  # 顶功逐字上屏每段单独 commit，不触发造词。
  # 必须用 /+ 追加到 filters 末尾：用 @before N 会挤掉其它 @before 挂载的下标（如快符、固定过滤器）。
  engine/filters/+:
    - lua_filter@*snow.auto_phrase
  auto_phrase:
    enable: true
    probe: false           # 排查时改 true：每次上屏打印各段编码与未造词的原因
    min_code_length: 4
    max_code_length: 6
    max_phrase_length: 2   # 先只做二字词，稳了再放开三字